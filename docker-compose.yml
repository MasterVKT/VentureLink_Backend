version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_ENV=development
      - DJANGO_SECRET_KEY=dev_secret_key_change_in_production
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0

  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres

  redis:
    image: redis:6
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery:
    build: .
    command: celery -A venture_link_project worker -l INFO
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - web
    environment:
      - DJANGO_ENV=development
      - DJANGO_SECRET_KEY=dev_secret_key_change_in_production
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0

  celery-beat:
    build: .
    command: celery -A venture_link_project beat -l INFO
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - web
    environment:
      - DJANGO_ENV=development
      - DJANGO_SECRET_KEY=dev_secret_key_change_in_production
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0

volumes:
  postgres_data:
  redis_data: 