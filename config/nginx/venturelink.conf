# Configuration Nginx pour VentureLink API
# À placer dans /etc/nginx/sites-available/

upstream venturelink_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name api.venturelink.com www.api.venturelink.com;
    
    # Rediriger vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
    
    # Configuration Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

server {
    listen 443 ssl http2;
    server_name api.venturelink.com www.api.venturelink.com;
    
    # Certificats SSL
    ssl_certificate /etc/letsencrypt/live/api.venturelink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.venturelink.com/privkey.pem;
    
    # Paramètres SSL optimisés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; connect-src 'self'";
    
    # Logs
    access_log /var/log/nginx/venturelink-api-access.log;
    error_log /var/log/nginx/venturelink-api-error.log;
    
    # Racine du site pour les fichiers statiques
    root /app/staticfiles;
    
    # Fichiers statiques
    location /static/ {
        alias /app/staticfiles/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    
    # Fichiers média
    location /media/ {
        alias /app/media/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    
    # Proxy vers Gunicorn
    location / {
        proxy_pass http://venturelink_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Limitation du trafic
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    limit_req zone=api_limit burst=10 nodelay;
    
    # Gestion des erreurs
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root /app/staticfiles/error_pages;
        internal;
    }
    
    location = /50x.html {
        root /app/staticfiles/error_pages;
        internal;
    }
    
    # Paramètres divers
    client_max_body_size 10M;  # Taille maximale des fichiers uploadés
    server_tokens off;  # Masquer la version de Nginx
} 